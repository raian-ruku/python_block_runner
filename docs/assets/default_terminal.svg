<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <filter id="term-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <style>
    .mono { font-family: "Iosevka NF", "Iosevka", "JetBrains Mono", "SF Mono", monospace; }
    .term-text { font-size: 14.5px; fill: #eceff4; line-height: 1.5; }
    .term-green { font-size: 14.5px; fill: #5af78e; }
    .term-cyan { font-size: 14.5px; fill: #57c7ff; }
    .term-dim { font-size: 14.5px; fill: #94a3b8; }
    .term-ok { font-size: 14.5px; fill: #a3be8c; }
    .term-yellow { font-size: 14.5px; fill: #ebcb8b; }
  </style>

  <!-- Container with Shadow -->
  <g transform="translate(30, 20)" filter="url(#term-shadow)">
    <!-- Terminal Background -->
    <rect width="940" height="475" rx="10" fill="#000000" stroke="#27272a" stroke-width="1.5" />

    <!-- macOS Window Bar -->
    <rect width="940" height="34" rx="10" fill="#18181b" />
    <path d="M 0 24 L 0 34 L 940 34 L 940 24 Z" fill="#18181b" />
    
    <!-- Window Controls -->
    <circle cx="20" cy="17" r="6" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5" />
    <circle cx="40" cy="17" r="6" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5" />
    <circle cx="60" cy="17" r="6" fill="#27c93f" stroke="#1aab29" stroke-width="0.5" />
    
    <!-- Titlebar label -->
    <text x="470" y="22" class="mono" font-size="12" fill="#71717a" text-anchor="middle">alex@MacBook-Pro: ~/projects/data-analytics (zsh)</text>

    <!-- Top Default Prompt Line -->
    <g transform="translate(20, 58)">
      <text x="0" y="16" class="mono term-green" font-weight="bold">alex@MacBook-Pro</text>
      <text x="148" y="16" class="mono" font-size="14.5" fill="#a1a1aa">:</text>
      <text x="158" y="16" class="mono term-cyan">~/projects/data-analytics</text>
      <text x="390" y="16" class="mono" font-size="14.5" fill="#f4f4f5">% </text>
      <text x="410" y="16" class="mono" font-size="14.5" fill="#ffffff" font-weight="bold">python3 analytics_pipeline.py</text>
    </g>

    <!-- Terminal Content Stream -->
    <g transform="translate(20, 95)">
      <!-- System Title -->
      <text x="0" y="18" class="mono term-text" font-weight="bold">Data Analytics &amp; Prediction Pipeline</text>
      <text x="0" y="34" class="mono term-dim">------------------------------------</text>

      <!-- Interactive Inputs Recorded -->
      <text x="0" y="62" class="mono term-text"><tspan fill="#38bdf8">Enter dataset path: </tspan><tspan fill="#a3be8c" font-weight="bold">data/customer_churn.csv</tspan></text>
      <text x="0" y="82" class="mono term-text"><tspan fill="#38bdf8">Enter cross-validation folds: </tspan><tspan fill="#a3be8c" font-weight="bold">5</tspan></text>
      <text x="0" y="102" class="mono term-text"><tspan fill="#38bdf8">Select classification model: </tspan><tspan fill="#a3be8c" font-weight="bold">2 (Gradient Boosting)</tspan></text>

      <!-- Section: Model Summary -->
      <text x="0" y="138" class="mono term-text" font-weight="bold">Dataset &amp; Training Summary</text>
      <text x="0" y="154" class="mono term-dim">--------------------------</text>
      <text x="0" y="174" class="mono term-text">Total Records: 14,250 | Features: 18 numeric, 4 categorical</text>
      <text x="0" y="192" class="mono term-text">Preprocessing: Missing values imputed (34), One-Hot encoded</text>
      <text x="0" y="210" class="mono term-text">Train Split: 11,400 (80%) | Test Split: 2,850 (20%)</text>
      <text x="0" y="228" class="mono term-text">Accuracy: <tspan fill="#a3be8c" font-weight="bold">94.62%</tspan>  |  Precision: 0.931  |  Recall: 0.945</text>
      <text x="0" y="246" class="mono term-text">F1-Score: <tspan fill="#ebcb8b" font-weight="bold">0.938</tspan>   |  ROC-AUC: <tspan fill="#a3be8c" font-weight="bold">0.971</tspan></text>
      <text x="0" y="264" class="mono term-text">Optimization: Converged in 42 iterations (early stopping)</text>
      <text x="0" y="282" class="mono term-text">Top Predictors: tenure, total_charges, contract_type</text>

      <!-- Summary -->
      <text x="0" y="318" class="mono term-ok">✓ All 5 folds evaluated  |  Model weights exported to models/gb_classifier.pkl</text>
    </g>

    <!-- Bottom Default Prompt Line with Cursor -->
    <g transform="translate(20, 442)">
      <text x="0" y="16" class="mono term-green" font-weight="bold">alex@MacBook-Pro</text>
      <text x="148" y="16" class="mono" font-size="14.5" fill="#a1a1aa">:</text>
      <text x="158" y="16" class="mono term-cyan">~/projects/data-analytics</text>
      <text x="390" y="16" class="mono" font-size="14.5" fill="#f4f4f5">% </text>
      <!-- Block Cursor -->
      <rect x="408" y="3" width="9" height="17" fill="#f4f4f5" opacity="0.9" />
    </g>
  </g>
</svg>
