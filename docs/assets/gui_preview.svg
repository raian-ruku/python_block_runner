<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 920" width="100%" height="100%">
  <defs>
    <filter id="gui-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <style>
    .ui-font { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }
    .mono { font-family: "Courier New", Courier, "Iosevka NF", monospace; }
  </style>

  <g transform="translate(20, 16)" filter="url(#gui-shadow)">
    <!-- Main Window Background (macOS native light window) -->
    <rect width="920" height="885" rx="10" fill="#eceff1" stroke="#b0bec5" stroke-width="1.5" />

    <!-- Window Titlebar -->
    <rect width="920" height="38" rx="10" fill="#e0e0e0" />
    <path d="M 0 26 L 0 38 L 920 38 L 920 26 Z" fill="#e0e0e0" />
    <line x1="0" y1="38" x2="920" y2="38" stroke="#cccccc" stroke-width="1" />

    <!-- macOS Traffic Light Controls -->
    <circle cx="20" cy="19" r="6" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5" />
    <circle cx="40" cy="19" r="6" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5" />
    <circle cx="60" cy="19" r="6" fill="#27c93f" stroke="#1aab29" stroke-width="0.5" />

    <text x="460" y="24" class="ui-font" font-size="13" font-weight="600" fill="#37474f" text-anchor="middle">
      PyBlockRunner
    </text>

    <!-- ══════════════════════════════════════════════════════════════════ -->
    <!-- ROW 0: Configuration LabelFrame (full width)                      -->
    <!-- ══════════════════════════════════════════════════════════════════ -->
    <g transform="translate(14, 50)">
      <rect width="892" height="156" rx="6" fill="#f8fafc" stroke="#b0bec5" stroke-width="1" />
      <rect x="12" y="-8" width="105" height="16" fill="#eceff1" />
      <text x="16" y="4" class="ui-font" font-size="11.5" font-weight="bold" fill="#475569">Configuration</text>

      <!-- Row 0: Script picker -->
      <g transform="translate(16, 20)">
        <text x="0" y="17" class="ui-font" font-size="12" fill="#334155">Script:</text>
        <rect x="55" y="0" width="715" height="26" rx="4" fill="#ffffff" stroke="#b0bec5" stroke-width="1" />
        <text x="65" y="17" class="ui-font" font-size="11.5" fill="#0f172a">/Users/alex/projects/data-analytics/analytics_pipeline.py</text>
        <!-- Browse button -->
        <rect x="780" y="0" width="80" height="26" rx="4" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1" />
        <text x="820" y="17" class="ui-font" font-size="12" fill="#1e293b" text-anchor="middle">Browse…</text>
      </g>

      <!-- Row 1: Name / ID (Optional) -->
      <g transform="translate(16, 56)">
        <text x="0" y="17" class="ui-font" font-size="12" fill="#334155">Name (optional):</text>
        <rect x="105" y="0" width="200" height="26" rx="4" fill="#ffffff" stroke="#b0bec5" stroke-width="1" />
        <text x="115" y="17" class="ui-font" font-size="12" fill="#0f172a">Alex Chen</text>

        <!-- Right-aligned ID -->
        <g transform="translate(520, 0)">
          <text x="0" y="17" class="ui-font" font-size="12" fill="#334155">ID / Roll No (optional):</text>
          <rect x="135" y="0" width="145" height="26" rx="4" fill="#ffffff" stroke="#b0bec5" stroke-width="1" />
          <text x="145" y="17" class="ui-font" font-size="12" fill="#0f172a">CS-2026-089</text>
        </g>
      </g>

      <!-- Row 2: Options -->
      <g transform="translate(16, 92)">
        <text x="0" y="17" class="ui-font" font-size="12" fill="#334155">Theme:</text>
        <rect x="52" y="0" width="75" height="26" rx="4" fill="#ffffff" stroke="#b0bec5" stroke-width="1" />
        <text x="62" y="17" class="ui-font" font-size="11.5" fill="#0f172a">light</text>
        <path d="M 112 11 L 118 17 L 124 11 Z" fill="#64748b" />

        <text x="140" y="17" class="ui-font" font-size="12" fill="#334155">State:</text>
        <rect x="180" y="0" width="85" height="26" rx="4" fill="#ffffff" stroke="#b0bec5" stroke-width="1" />
        <text x="190" y="17" class="ui-font" font-size="11.5" fill="#0f172a">Shared</text>
        <path d="M 250 11 L 256 17 L 262 11 Z" fill="#64748b" />

        <!-- Checkbox: Include Code (Unselected) -->
        <g transform="translate(280, 4)">
          <rect width="16" height="16" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
          <text x="22" y="13" class="ui-font" font-size="12" fill="#334155">Include Code</text>
        </g>

        <!-- Checkbox: Cover Page (Unselected) -->
        <g transform="translate(390, 4)">
          <rect width="16" height="16" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
          <text x="22" y="13" class="ui-font" font-size="12" fill="#334155">Cover Page</text>
        </g>

        <text x="495" y="17" class="ui-font" font-size="12" fill="#334155">Timeout (s):</text>
        <rect x="575" y="0" width="50" height="26" rx="4" fill="#ffffff" stroke="#b0bec5" stroke-width="1" />
        <text x="585" y="17" class="ui-font" font-size="12" fill="#0f172a">30</text>

        <text x="640" y="17" class="ui-font" font-size="12" fill="#334155">Output PDF:</text>
        <rect x="715" y="0" width="115" height="26" rx="4" fill="#ffffff" stroke="#b0bec5" stroke-width="1" />
        <text x="722" y="17" class="ui-font" font-size="10.5" fill="#64748b">analytics_pip…</text>
        <rect x="835" y="0" width="25" height="26" rx="4" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1" />
        <text x="847" y="17" class="ui-font" font-size="12" fill="#1e293b" text-anchor="middle">…</text>
      </g>

      <!-- Row 3: Font Row -->
      <g transform="translate(16, 126)">
        <text x="0" y="15" class="ui-font" font-size="12" fill="#334155">Document Font:</text>
        <text x="105" y="15" class="ui-font" font-size="12" font-weight="bold" fill="#2563eb">Default (Iosevka NF / System)</text>
        <rect x="290" y="-2" width="105" height="24" rx="4" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1" />
        <text x="342" y="14" class="ui-font" font-size="11.5" fill="#1e293b" text-anchor="middle">Choose Font…</text>
        <text x="408" y="15" class="ui-font" font-size="11" fill="#64748b">(terminal output locked to Iosevka NF)</text>
      </g>
    </g>

    <!-- ══════════════════════════════════════════════════════════════════ -->
    <!-- ROW 1: Detected Blocks LabelFrame (full width)                    -->
    <!-- ══════════════════════════════════════════════════════════════════ -->
    <g transform="translate(14, 214)">
      <rect width="892" height="154" rx="6" fill="#f8fafc" stroke="#b0bec5" stroke-width="1" />
      <rect x="12" y="-8" width="125" height="16" fill="#eceff1" />
      <text x="16" y="4" class="ui-font" font-size="11.5" font-weight="bold" fill="#475569">Detected Blocks</text>

      <!-- Block Checklist Grid (2-column layout to fit all blocks cleanly) -->
      <g transform="translate(16, 16)">
        <!-- Col 1 -->
        <g transform="translate(0, 0)">
          <rect width="15" height="15" rx="3" fill="#2563eb" />
          <path d="M 3.5 7.5 L 6.5 10.5 L 12 3.5" stroke="#ffffff" stroke-width="2" fill="none" />
          <text x="24" y="12" class="ui-font" font-size="12" fill="#0f172a">1. load libraries and dataset</text>
        </g>
        <g transform="translate(0, 30)">
          <rect width="15" height="15" rx="3" fill="#2563eb" />
          <path d="M 3.5 7.5 L 6.5 10.5 L 12 3.5" stroke="#ffffff" stroke-width="2" fill="none" />
          <text x="24" y="12" class="ui-font" font-size="12" fill="#0f172a">2. interactive parameter configuration</text>
        </g>
        <g transform="translate(0, 60)">
          <rect width="15" height="15" rx="3" fill="#2563eb" />
          <path d="M 3.5 7.5 L 6.5 10.5 L 12 3.5" stroke="#ffffff" stroke-width="2" fill="none" />
          <text x="24" y="12" class="ui-font" font-size="12" fill="#0f172a">3. feature engineering and cleaning</text>
        </g>
        <g transform="translate(0, 90)">
          <rect width="15" height="15" rx="3" fill="#2563eb" />
          <path d="M 3.5 7.5 L 6.5 10.5 L 12 3.5" stroke="#ffffff" stroke-width="2" fill="none" />
          <text x="24" y="12" class="ui-font" font-size="12" fill="#0f172a">4. train gradient boosting classifier</text>
        </g>

        <!-- Col 2 -->
        <g transform="translate(440, 0)">
          <rect width="15" height="15" rx="3" fill="#2563eb" />
          <path d="M 3.5 7.5 L 6.5 10.5 L 12 3.5" stroke="#ffffff" stroke-width="2" fill="none" />
          <text x="24" y="12" class="ui-font" font-size="12" fill="#0f172a">5. calculate performance metrics</text>
        </g>
        <g transform="translate(440, 30)">
          <rect width="15" height="15" rx="3" fill="#2563eb" />
          <path d="M 3.5 7.5 L 6.5 10.5 L 12 3.5" stroke="#ffffff" stroke-width="2" fill="none" />
          <text x="24" y="12" class="ui-font" font-size="12" fill="#0f172a">6. evaluate test predictions</text>
        </g>
        <g transform="translate(440, 60)">
          <rect width="15" height="15" rx="3" fill="#2563eb" />
          <path d="M 3.5 7.5 L 6.5 10.5 L 12 3.5" stroke="#ffffff" stroke-width="2" fill="none" />
          <text x="24" y="12" class="ui-font" font-size="12" fill="#0f172a">7. feature importance analysis</text>
        </g>
        <g transform="translate(440, 90)">
          <rect width="15" height="15" rx="3" fill="#2563eb" />
          <path d="M 3.5 7.5 L 6.5 10.5 L 12 3.5" stroke="#ffffff" stroke-width="2" fill="none" />
          <text x="24" y="12" class="ui-font" font-size="12" fill="#0f172a">8. loss convergence curve (plot)</text>
        </g>
      </g>
    </g>

    <!-- ══════════════════════════════════════════════════════════════════ -->
    <!-- ROW 2: Execution Progress LabelFrame (full width)                 -->
    <!-- ══════════════════════════════════════════════════════════════════ -->
    <g transform="translate(14, 376)">
      <rect width="892" height="74" rx="6" fill="#f8fafc" stroke="#b0bec5" stroke-width="1" />
      <rect x="12" y="-8" width="135" height="16" fill="#eceff1" />
      <text x="16" y="4" class="ui-font" font-size="11.5" font-weight="bold" fill="#475569">Execution Progress</text>

      <!-- Top Row inside Progress Frame -->
      <g transform="translate(16, 14)">
        <text x="0" y="18" class="ui-font" font-size="12.5" font-weight="500" fill="#0f172a">Done! All blocks finished in 1.48s.</text>
        
        <!-- Run & Open PDF Buttons (aligned right) -->
        <g transform="translate(680, 0)">
          <!-- Run Accent Button -->
          <rect x="0" y="0" width="80" height="28" rx="5" fill="#2563eb" />
          <text x="40" y="18" class="ui-font" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">▶  Run</text>

          <!-- Open PDF Button -->
          <rect x="90" y="0" width="90" height="28" rx="5" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1" />
          <text x="135" y="18" class="ui-font" font-size="12" font-weight="500" fill="#1e293b" text-anchor="middle">Open PDF</text>
        </g>
      </g>

      <!-- Bottom Row: Determinate Progress Bar -->
      <g transform="translate(16, 48)">
        <rect width="860" height="10" rx="5" fill="#e2e8f0" />
        <rect width="860" height="10" rx="5" fill="#10b981" />
      </g>
    </g>

    <!-- ══════════════════════════════════════════════════════════════════ -->
    <!-- ROW 3: Console Output LabelFrame (full width)                     -->
    <!-- ══════════════════════════════════════════════════════════════════ -->
    <g transform="translate(14, 458)">
      <rect width="892" height="240" rx="6" fill="#f8fafc" stroke="#b0bec5" stroke-width="1" />
      <rect x="12" y="-8" width="115" height="16" fill="#eceff1" />
      <text x="16" y="4" class="ui-font" font-size="11.5" font-weight="bold" fill="#475569">Console Output</text>

      <!-- Inner Console Box (#1a1a1a with scrollbar on right) -->
      <g transform="translate(12, 12)">
        <rect width="850" height="216" fill="#1a1a1a" />
        
        <!-- Text content with Courier New font & tagged colors -->
        <g transform="translate(12, 18)">
          <text x="0" y="0" class="mono" font-size="11" fill="#aaaaaa">Running 8 block(s) from analytics_pipeline.py</text>
          
          <text x="0" y="18" class="mono" font-size="11" fill="#aaaaaa">▶ load libraries and dataset</text>
          <text x="0" y="34" class="mono" font-size="11" fill="#6fcf97">✓ 14ms</text>

          <text x="0" y="54" class="mono" font-size="11" fill="#aaaaaa">▶ interactive parameter configuration</text>
          <text x="0" y="70" class="mono" font-size="11" fill="#aaaaaa">⌨ Waiting for input: 'Enter cross-validation folds: '…</text>
          <text x="0" y="86" class="mono" font-size="11" fill="#6fcf97">→ Entered: 5</text>
          <text x="0" y="102" class="mono" font-size="11" fill="#6fcf97">✓ 210ms</text>

          <text x="0" y="122" class="mono" font-size="11" fill="#aaaaaa">▶ train gradient boosting classifier</text>
          <text x="0" y="138" class="mono" font-size="11" fill="#6fcf97">✓ 640ms</text>

          <text x="0" y="158" class="mono" font-size="11" fill="#aaaaaa">▶ loss convergence curve (plot)</text>
          <text x="0" y="174" class="mono" font-size="11" fill="#6fcf97">✓ 180ms  [1 plot(s)]</text>

          <text x="0" y="194" class="mono" font-size="11" fill="#6fcf97">✓ PDF saved → analytics_pipeline_output.pdf</text>
        </g>

        <!-- Vertical Scrollbar on Right -->
        <g transform="translate(850, 0)">
          <rect width="18" height="216" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="0.5" />
          <rect x="2" y="2" width="14" height="60" rx="3" fill="#94a3b8" />
        </g>
      </g>
    </g>

    <!-- ══════════════════════════════════════════════════════════════════ -->
    <!-- ROW 4: Latest Block Preview LabelFrame (full width)               -->
    <!-- ══════════════════════════════════════════════════════════════════ -->
    <g transform="translate(14, 706)">
      <rect width="892" height="162" rx="6" fill="#f8fafc" stroke="#b0bec5" stroke-width="1" />
      <rect x="12" y="-8" width="150" height="16" fill="#eceff1" />
      <text x="16" y="4" class="ui-font" font-size="11.5" font-weight="bold" fill="#475569">Latest Block Preview</text>

      <!-- Centered Thumbnail of Rendered Terminal Output -->
      <g transform="translate(146, 16)">
        <rect width="600" height="130" rx="4" fill="#000000" stroke="#334155" stroke-width="1" />
        <!-- Top prompt line in thumbnail -->
        <text x="12" y="18" class="mono" font-size="9.5" fill="#5af78e">alex@MacBook-Pro<tspan fill="#a1a1aa">:</tspan><tspan fill="#57c7ff">~/projects/data-analytics</tspan><tspan fill="#f4f4f5"> % </tspan><tspan fill="#ffffff">python3 analytics_pipeline.py</tspan></text>
        
        <text x="12" y="38" class="mono" font-size="9" fill="#eceff4">Data Analytics &amp; Prediction Pipeline</text>
        <text x="12" y="52" class="mono" font-size="9" fill="#64748b">------------------------------------</text>
        <text x="12" y="68" class="mono" font-size="9" fill="#eceff4">Accuracy: 94.62%  |  Precision: 0.931  |  Recall: 0.945</text>
        <text x="12" y="84" class="mono" font-size="9" fill="#a3be8c">✓ All 5 folds evaluated  |  Model weights exported</text>

        <!-- Bottom prompt in thumbnail -->
        <text x="12" y="108" class="mono" font-size="9.5" fill="#5af78e">alex@MacBook-Pro<tspan fill="#a1a1aa">:</tspan><tspan fill="#57c7ff">~/projects/data-analytics</tspan><tspan fill="#f4f4f5"> % █</tspan></text>
      </g>
    </g>
  </g>
</svg>
