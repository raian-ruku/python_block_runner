<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="100%">
  <defs>
    <filter id="win-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <style>
    .mono { font-family: "Iosevka NF", "Iosevka", "JetBrains Mono", "SF Mono", monospace; }
    .term-text { font-size: 14.5px; fill: #eceff4; line-height: 1.5; }
    .term-muted { font-size: 14.5px; fill: #88c0d0; }
    .term-green { font-size: 14.5px; fill: #a3be8c; }
    .term-yellow { font-size: 14.5px; fill: #ebcb8b; }
    .term-cyan { font-size: 14.5px; fill: #8fbcbb; }
  </style>

  <!-- Container with Shadow -->
  <g transform="translate(30, 25)" filter="url(#win-shadow)">
    <!-- Terminal Background -->
    <rect width="940" height="505" rx="10" fill="#000000" stroke="#2e3440" stroke-width="1.5" />

    <!-- macOS Window Bar -->
    <rect width="940" height="34" rx="10" fill="#181a1f" />
    <path d="M 0 24 L 0 34 L 940 34 L 940 24 Z" fill="#181a1f" />
    
    <!-- Window Controls -->
    <circle cx="20" cy="17" r="6" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5" />
    <circle cx="40" cy="17" r="6" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5" />
    <circle cx="60" cy="17" r="6" fill="#27c93f" stroke="#1aab29" stroke-width="0.5" />
    
    <!-- Titlebar label -->
    <text x="470" y="22" class="mono" font-size="12" fill="#717885" text-anchor="middle">alexchen — analytics_pipeline.py — Starship (Iosevka NF)</text>

    <!-- Top Starship Prompt Line -->
    <g transform="translate(18, 55)">
      <!-- 1. Apple Icon Segment -->
      <path d="M 0 0 L 28 0 L 36 24 L 0 24 Z" fill="#434c5e" />
      <text x="8" y="16.5" font-family="-apple-system, sans-serif" font-size="13" fill="#eceff4"></text>

      <!-- 2. Username Segment -->
      <path d="M 36 0 L 126 0 L 134 24 L 28 24 Z" fill="#4c566a" />
      <text x="44" y="16.5" class="mono" font-size="12" font-weight="600" fill="#e5e9f0">alexchen</text>

      <!-- 3. Path Segment -->
      <path d="M 134 0 L 450 0 L 458 24 L 126 24 Z" fill="#3b4252" />
      <text x="144" y="16.5" class="mono" font-size="12" fill="#88c0d0">~/workspace/data-analytics-pipeline</text>

      <!-- 4. Python Version Segment -->
      <path d="M 458 0 L 537 0 L 545 24 L 450 24 Z" fill="#434c5e" />
      <text x="467" y="16" class="mono" font-size="12" fill="#ebcb8b"> v3.14.7</text>

      <!-- 5. Time Segment -->
      <path d="M 545 0 L 631 0 L 639 24 L 537 24 Z" fill="#4c566a" />
      <text x="553" y="16" class="mono" font-size="12" fill="#d8dee9">🕞 03:04 PM</text>

      <!-- Prompt Arrow / Separator -->
      <path d="M 639 0 L 647 12 L 639 24 Z" fill="#4c566a" />
      <text x="653" y="16.5" class="mono" font-size="13" font-weight="bold" fill="#81a1c1">❯</text>
      
      <!-- Command typed -->
      <text x="669" y="16.5" class="mono" font-size="13" fill="#eceff4">python3 analytics_pipeline.py</text>
    </g>

    <!-- Terminal Content Stream -->
    <g transform="translate(18, 105)">
      <!-- System Title -->
      <text x="0" y="18" class="mono term-text" font-weight="bold">Data Analytics &amp; Prediction Pipeline</text>
      <text x="0" y="34" class="mono" font-size="14.5" fill="#4c566a">------------------------------------</text>

      <!-- Interactive Inputs Recorded -->
      <text x="0" y="62" class="mono term-text"><tspan fill="#81a1c1">Enter dataset path: </tspan><tspan fill="#a3be8c" font-weight="bold">data/customer_churn.csv</tspan></text>
      <text x="0" y="82" class="mono term-text"><tspan fill="#81a1c1">Enter cross-validation folds: </tspan><tspan fill="#a3be8c" font-weight="bold">5</tspan></text>
      <text x="0" y="102" class="mono term-text"><tspan fill="#81a1c1">Select classification model: </tspan><tspan fill="#a3be8c" font-weight="bold">2 (Gradient Boosting)</tspan></text>

      <!-- Section: Model Summary -->
      <text x="0" y="140" class="mono term-text" font-weight="bold">Dataset &amp; Training Summary</text>
      <text x="0" y="156" class="mono" font-size="14.5" fill="#4c566a">--------------------------</text>
      <text x="0" y="176" class="mono term-text">Total Records: 14,250 | Features: 18 numeric, 4 categorical</text>
      <text x="0" y="194" class="mono term-text">Preprocessing: Missing values imputed (34), One-Hot encoded</text>
      <text x="0" y="212" class="mono term-text">Train Split: 11,400 (80%) | Test Split: 2,850 (20%)</text>
      <text x="0" y="230" class="mono term-text">Accuracy: <tspan fill="#a3be8c" font-weight="bold">94.62%</tspan>  |  Precision: 0.931  |  Recall: 0.945</text>
      <text x="0" y="248" class="mono term-text">F1-Score: <tspan fill="#ebcb8b" font-weight="bold">0.938</tspan>   |  ROC-AUC: <tspan fill="#a3be8c" font-weight="bold">0.971</tspan></text>
      <text x="0" y="266" class="mono term-text">Optimization: Converged in 42 iterations (early stopping)</text>
      <text x="0" y="284" class="mono term-text">Top Predictors: tenure, total_charges, contract_type</text>

      <!-- Summary -->
      <text x="0" y="325" class="mono term-green">✓ All 5 folds evaluated  |  Model weights exported to models/gb_classifier.pkl</text>
    </g>

    <!-- Bottom Starship Prompt Line with Execution Duration -->
    <g transform="translate(18, 465)">
      <!-- 1. Apple Icon Segment -->
      <path d="M 0 0 L 28 0 L 36 24 L 0 24 Z" fill="#434c5e" />
      <text x="8" y="16.5" font-family="-apple-system, sans-serif" font-size="13" fill="#eceff4"></text>

      <!-- 2. Username Segment -->
      <path d="M 36 0 L 126 0 L 134 24 L 28 24 Z" fill="#4c566a" />
      <text x="44" y="16.5" class="mono" font-size="12" font-weight="600" fill="#e5e9f0">alexchen</text>

      <!-- 3. Path Segment -->
      <path d="M 134 0 L 450 0 L 458 24 L 126 24 Z" fill="#3b4252" />
      <text x="144" y="16.5" class="mono" font-size="12" fill="#88c0d0">~/workspace/data-analytics-pipeline</text>

      <!-- 4. Python Version Segment -->
      <path d="M 458 0 L 537 0 L 545 24 L 450 24 Z" fill="#434c5e" />
      <text x="467" y="16" class="mono" font-size="12" fill="#ebcb8b"> v3.14.7</text>

      <!-- 5. Time Segment -->
      <path d="M 545 0 L 631 0 L 639 24 L 537 24 Z" fill="#4c566a" />
      <text x="553" y="16" class="mono" font-size="12" fill="#d8dee9">🕞 03:04 PM</text>

      <!-- 6. Execution Duration Segment -->
      <path d="M 639 0 L 725 0 L 733 24 L 631 24 Z" fill="#d08770" />
      <text x="647" y="16.5" class="mono" font-size="12" font-weight="bold" fill="#2e3440">⏱ 1s240ms</text>

      <!-- Prompt Arrow -->
      <path d="M 733 0 L 741 12 L 733 24 Z" fill="#d08770" />
      <text x="747" y="16.5" class="mono" font-size="13" font-weight="bold" fill="#81a1c1">❯</text>

      <!-- Terminal Cursor Block -->
      <rect x="762" y="3" width="9" height="18" fill="#eceff4" opacity="0.85" />
    </g>
  </g>
</svg>
