<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="100%" height="100%">
  <defs>
    <filter id="modal-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <style>
    .ui-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .mono-text { font-family: "Iosevka NF", "SF Mono", monospace; }
  </style>

  <!-- Ambient Backdrop -->
  <rect width="680" height="340" fill="#0f172a" opacity="0.3" rx="10" />

  <!-- Dialog Window -->
  <g transform="translate(100, 35)" filter="url(#modal-shadow)">
    <rect width="480" height="260" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />

    <!-- Window Titlebar -->
    <rect width="480" height="38" rx="10" fill="#f8fafc" />
    <path d="M 0 28 L 0 38 L 480 38 L 480 28 Z" fill="#f8fafc" />
    <line x1="0" y1="38" x2="480" y2="38" stroke="#e2e8f0" stroke-width="1" />
    
    <circle cx="20" cy="19" r="5" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5" />
    <circle cx="36" cy="19" r="5" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5" />
    <circle cx="52" cy="19" r="5" fill="#27c93f" stroke="#1aab29" stroke-width="0.5" />
    
    <text x="240" y="24" class="ui-text" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">
      User Input Required
    </text>

    <!-- Dialog Body -->
    <g transform="translate(28, 62)">
      <!-- Header Badge / Section -->
      <g transform="translate(0, 0)">
        <text x="0" y="16" class="ui-text" font-size="14" font-weight="700" fill="#0f172a">
          ⌨ Block 2: interactive parameter configuration
        </text>
      </g>

      <!-- Prompt text -->
      <text x="0" y="44" class="mono-text" font-size="13" font-weight="500" fill="#334155">
        Enter cross-validation folds [3-10]:
      </text>

      <!-- Input Text Field with focus ring -->
      <g transform="translate(0, 56)">
        <rect width="424" height="36" rx="6" fill="#f8fafc" stroke="#2563eb" stroke-width="2" />
        <text x="14" y="23" class="mono-text" font-size="13" fill="#0f172a">5</text>
        <line x1="30" y1="8" x2="30" y2="28" stroke="#2563eb" stroke-width="1.5">
          <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
        </line>
      </g>

      <!-- Footer Action Buttons -->
      <g transform="translate(0, 118)">
        <text x="0" y="24" class="ui-text" font-size="11" fill="#94a3b8">
          Press <tspan font-weight="bold">Enter</tspan> to submit, <tspan font-weight="bold">Esc</tspan> to skip
        </text>

        <!-- Cancel Button -->
        <rect x="250" y="4" width="80" height="32" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
        <text x="290" y="25" class="ui-text" font-size="12.5" font-weight="600" fill="#475569" text-anchor="middle">Cancel</text>

        <!-- Submit Button -->
        <rect x="340" y="4" width="84" height="32" rx="6" fill="#2563eb" />
        <text x="382" y="25" class="ui-text" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">Submit</text>
      </g>
    </g>
  </g>
</svg>
